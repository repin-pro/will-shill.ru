            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-ornamentalnaya-kompoziciya-v-stile-modern-s-gornym-peyzazhem-i-simvolicheskim-centrom-2013.jpg"
              alt="Орнаментальная композиция Михаила Вяльшина (2013) в стилистике модерна: в центре — симметричный декоративный элемент с крестообразной структурой и стилизованными деталями, напоминающими геральдику или сакральную геометрию; по бокам — текучие растительные формы с крупными цветами, завитками и элементами, похожими на щупальца или корни. На фоне — панорамный горный пейзаж с рекой, мостами и скалистыми утёсами в приглушённой бежево‑коричневой гамме. Композицию обрамляет сложная декоративная рамка с флоральными и абстрактными мотивами; в верхней части — миниатюрные таблички с надписями, в нижней — треугольная плашка с текстом. Тонкая графика, плавные линии и многослойная детализация подчёркивают декоративность и символизм работы ">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-majestic-waterfall-among-ancient-trees-oil-painting-2007.jpg"
              alt="Пейзаж Михаила Вяльшина (2007) с величественным водопадом: мощный поток воды обрушивается с отвесной скалы, образуя густую пелену брызг и лёгкую дымку у подножия. На переднем плане — группа высоких деревьев с изогнутыми ветвями и густой кроной; их стволы подчёркнуты тёплыми охристыми оттенками, контрастирующими с прохладной синевой падающей воды. Скалистый утёс имеет слоистую структуру и окрашен в тёплые терракотово‑бежевые тона; по склонам рассыпаны кустарники и низкорослая растительность. В верхней части полотна — светлое небо с мягкими переходами от бледно‑голубого к золотистому, создающими ощущение раннего утра. Композиция построена на контрасте динамики водопада и статичности скал и деревьев; плотная фактурная проработка мазков подчёркивает материальность природных форм">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-autumn-heart-ornament-art-nouveau-design-2023.jpg"
              alt="Орнаментальная композиция Михаила Вяльшина (2023) в эстетике модерна, имитирующая ажурную кованую решётку: вертикальная симметричная структура с заострённым шпилем вверху и вытянутым изогнутым завершением внизу. В центре — ярко‑оранжевый кленовый лист с детальной прорисовкой прожилок, выступающий как главный цветовой акцент; вокруг него — плавные текучие линии, стилизованные растительные формы и завитковые элементы в тёплой коричнево‑золотистой гамме. В верхней части — мотив сердца, вписанный в круглую ячейку; по бокам — крупные изогнутые лепестки с градиентной заливкой. В нижней зоне — веерообразные детали, напоминающие стилизованные крылья или складки ткани, и тонкий каплевидный элемент с сердечным мотивом. Просветы между линиями заполнены бледно‑голубым тоном, подчёркивающим воздушность и ритм узора. В правом нижнем углу — авторская монограмма «МВ» и дата «2023». Композиция сочетает декоративную сложность, изящество линий и символику осени и чувств.">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-the-gateway-to-vigenia-fantasy-landscape-art-nouveau-2016.jpg"
              alt="Фантазийный пейзаж Михаила Вяльшина (2016) в стилистике ар‑нуво: в центре композиции — широкая каменная дорога из жёлто‑бежевых плит, сужающаяся в перспективе и ведущая к изящной арке с каллиграфической надписью «VIGENIA». По обе стороны дороги — зеркальные водоёмы с отражением изогнутых узловатых деревьев; в правой части воды проступает стилизованный мотив глаза. На среднем плане — сказочный город с белокаменными башнями, остроконечными шпилями и ажурными мостами; его архитектура сочетает готические и модерновые элементы. Фоном служат монументальные горы с заснеженными пиками и каскадными водопадами; на одном из утёсов — руинированное строение с арочными проёмами. Композицию обрамляют витиеватые растительные орнаменты в коричнево‑бежевой гамме, перекликающиеся с формами ветвей. В нижней части — декоративная табличка с рукописным посвящением, стилизованным под старинную гравюру. Палитра построена на мягких контрастах: холодные голубовато‑серые тона гор и неба уравновешены тёплыми охристыми оттенками дороги и архитектуры, а зелень листвы добавляет свежести. Тонкая детализация фактур (каменная кладка, кора деревьев, складки скал) и плавные текучие линии подчёркивают декоративную выразительность и эпическую образность работы; композиция воспринимается как символические врата в волшебную страну, где природа, архитектура и орнамент образуют единый гармоничный мир.">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-the-lantern-realm-art-nouveau-fantasy-architecture-2014.jpg"
              alt="Фантастическая композиция Михаила Вяльшина (2014) в стилистике ар‑нуво: в центре — причудливый архитектурный ландшафт, где природа и зодчество сливаются в единый органичный мир. На переднем плане — массивные каменные арки и мостовые опоры, увитые изогнутыми, узловатыми корнями и ветвями; между пролётами — густая поросль мха, папоротников и причудливых грибов. Слева доминирует огромное искривлённое дерево с переплетёнными стволами; в его ветвях подвешены декоративные фонари с тёплым светом, их кованые каркасы перекликаются с орнаментальной рамкой картины. В глубине композиции — многоуровневый замок с остроконечными башнями, мостиками и галереями, словно вырастающий из скал и древесных форм; фасады украшены стилизованными окнами, крестами и арками. В правой части — парящий в дымке воздушный шар, добавляющий сцене оттенок стимпанка. На площадке у арок — миниатюрные фигуры: сидящая женщина в длинном одеянии, сосуд‑урна и крошечные детали быта, создающие ощущение масштаба и тайны. Композицию обрамляет изысканная рамка в духе модерна: витиеватые завитки, стилизованные листья и декоративные медальоны в углах. В нижней части — авторские надписи в старинной типографике, включая имя художника, дату и технические данные (карандаш, акварель). Тёплая приглушённая палитра — оттенки сепии, оливкового, дымчато‑серого и янтарного — подчёркивает атмосферу сумеречного, зачарованного пространства. Тонкая штриховка, плотная детализация фактур (коры, камня, ткани, металла) и ритмичное чередование вертикальных и изогнутых линий формируют образ «царства фонарей» — таинственного убежища на границе реальности и грёзы .">

              alt="«Чайно‑кофейная утопия» (2008) — фантазийная композиция Михаила Вяльшина в стилистике модерна, исполненная тушью, акрилом и кофе на картоне. В центре — гротескный персонаж в цилиндре с нимбом, держащий жезл и окружённый символами: гитарой, табличкой «WAR MAN», витыми лентами с надписями и декоративными бабочками. Справа — причудливые фигуры с театральными позами, книгами с орнаментами и остроконечными головными уборами; между ними — крупная каллиграфическая надпись «СКОРБЬ». Композиция насыщена текучими линиями, завитками и орнаментальными элементами, создающими эффект многослойной графики; в нижней части — подпись автора, дата и технические данные работы ">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-cascade-waterfalls-landscape-oil-painting-2010s.jpg"
              alt="Пейзаж с каскадными водопадами Михаила Вяльшина (2010‑е): мощные потоки воды стремительно падают с отвесных скал, образуя густую пелену брызг и тумана у подножия. В центре композиции — три основных водопада разной высоты, подчёркивающих масштаб и динамику сцены. Окружающий ландшафт представлен причудливо изогнутыми деревьями с густой кроной, массивными валунами на переднем плане и низкорослой растительностью. Тёплая цветовая гамма строится на сочетании охристых и терракотовых оттенков скал, насыщенной зелени листвы и холодных голубых тонов падающей воды. Небо написано мягкими переходами от бледно‑голубого к золотистому, что придаёт картине атмосферу раннего утра или заката. Работа выполнена в живописной манере с выраженной фактурой и вниманием к декоративным деталям">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-ornamental-lettering-art-no-translation-black-and-white-2010s.jpg"
              alt="Каллиграфическая композиция Михаила Вяльшина (2010‑е) в технике чёрно‑белого леттеринга: в центре — стилизованная надпись на кириллице, выполненная в декоративном готико‑модерновом шрифте с выразительными засечками, контрастными утолщениями штрихов и сложными лигатурами. Композицию обрамляет асимметричный орнамент из плавных завитков, растительных побегов и геометрических ромбов; в верхней левой части — миниатюрный архитектурный элемент, напоминающий барочный картуш. В нижней зоне — переплетённые ленточные мотивы с флоральными вставками и тонкой контурной штриховкой, создающей эффект объёма. Монохромная гамма построена на градациях чёрного, тёмно‑серого и белого; акцент сделан на ритме линий, балансе пустот и плотности заполнения, а также на сочетании строгой геометрии букв и текучих органических форм декора">

              alt="Декоративная композиция Михаила Вяльшина (2016) в стилистике ар‑нуво: в центре — крупная стилизованная монограмма, выполненная в строгой чёрно‑белой графике с ритмичными вертикалями и плавными завитками; она помещена в овальный медальон, который служит визуальным ядром всей работы. Композицию обрамляет сложная орнаментальная рамка с растительными мотивами: изогнутые ветви с детальной проработкой коры, цветы с многослойными лепестками и тонкие вьющиеся стебли образуют непрерывный узор, перетекающий от края к краю. Слева — фантазийный архитектурный элемент, напоминающий миниатюрный готико‑модерновый павильон с остроконечным завершением и ажурными деталями; справа — плотная группа стилизованных цветов в тёплой розово‑коричневой гамме. В верхней части — лаконичные геометрические вставки с растительными акцентами, подчёркивающие симметрию и ритм; в нижней — узкая полоса с рукописным текстом и авторской монограммой «МВ», а также датой «2016». Палитра построена на сочетании приглушённого зелёного фона, землистых коричневых и бежевых тонов, контрастных чёрных линий и нежных розовых акцентов. Тонкая контурная графика, плавные текучие линии и плотная детализация подчёркивают декоративную выразительность и преемственность традиций модерна; композиция воспринимается как изысканная графическая фантазия, объединяющая каллиграфию, архитектуру и природный орнамент.">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-the-tea-farewells-of-the-dragoness-povlent-art-nouveau-fantasy-illustration-2014.jpg"
              alt="Фантазийная иллюстрация Михаила Вяльшина (2014) в стилистике ар‑нуво: в центре композиции — парящая платформа‑корабль с башнями, мостиками и декоративными надстройками; на палубе — стилизованный чайный сервиз и абстрактные архитектурные формы, отсылающие к теме «чайных проводов». Справа — монументальный извивающийся дракон с орнаментальной чешуёй, чьи линии перекликаются с растительными завитками рамки; слева — вертикальный блок с миниатюрными домиками, фонарём и переплетёнными корнями, создающими ощущение волшебного города. Композицию обрамляет сложная декоративная рамка с текучими, «живыми» контурами, характерными для модерна; в верхней и нижней частях — текстовые плашки с авторской стилизацией под старинную типографику, включая фразу «Чайные проводы драконессы Повлент» и ироничную ремарку о чаепитии. В правой части — парусник с жёлтыми парусами, органично вписанный в фантастический ландшафт; между элементами — тонкие растительные мотивы, капли воды и лёгкие облака, усиливающие декоративность. Палитра построена на тёплой коричнево‑золотой гамме с акцентами охры, янтаря и тёмно‑серого; контрастные чёрные контуры подчёркивают графическую чёткость и детализацию (фактура дерева, камня, чешуи, ткани парусов). Плотная проработка мелких деталей, ритм вертикальных и изогнутых линий, а также синтез архитектуры, морской тематики и драконьей мифологии формируют образ сказочного ритуала — торжественных «проводов», где чай выступает символом перехода и прощания ">

            <img class="gallery-image"
              src="img/gallery-data/gallery/mikhail-vyalshin-the-dragon-and-the-tower-art-nouveau-fantasy-illustration-2014.jpg"
              alt="Фантазийная иллюстрация Михаила Вяльшина (2014) в стилистике ар‑нуво: композиция заключена в изысканную декоративную рамку из текучих, изогнутых линий и растительных завитков в сине‑зелёной гамме. В центре — мистический пейзаж: массивный извивающийся дракон с детализированной чешуёй, чьи формы перекликаются с корнями и древесными стволами; над ним — вытянутая башня с остроконечным шпилем и удлинёнными «тревожными» глазами на фасаде, создающими ощущение одушевлённости архитектуры. В верхней части — призрачный лик с длинными спутанными прядями, словно сотканный из тумана и тонких линий; в нижних углах — два стилизованных медальона с орнаментальными мотивами, напоминающими лунные диски или магические печати. Пространство между элементами заполнено каскадами свисающих побегов, мха и ажурных переплетений, формирующих эффект «живой» границы между мирами. Тонкая штриховка, контрастные чёрные контуры и деликатная цветовая палитра (приглушённые бирюзовые, коричнево‑охристые и дымчато‑серые тона) подчёркивают декоративную сложность и графическую выразительность работы. Ритмичное чередование вертикальных осей башни и плавных изгибов дракона создаёт напряжённый баланс между статикой и движением, раскрывая тему противостояния и единства стихий — камня и огня, порядка и хаоса. Плотная детализация фактур (чешуя, каменная кладка, волокнистые пряди, лиственные завитки) и авторская подпись в нижней части усиливают ощущение ручной, ювелирной проработки каждой линии .">
