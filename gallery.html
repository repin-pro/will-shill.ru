  <header class="header">
    <div class="header__slider-wrapper">
      <div class="slider">
        <!-- Контейнер для фоновых изображений -->
        <div class="slider__background">
          <div class="slide slide-1"></div>
          <div class="slide slide-2"></div>
          <div class="slide slide-3"></div>
          <div class="slide slide-4"></div>
          <div class="slide slide-5"></div>
          <div class="slide slide-6"></div>
          <div class="slide slide-7"></div>
        </div>
      </div>

      <!-- Контент, который должен оставаться видимым -->
      <div class="header__overlay container">
        <!-- Логотип и бургер внутри контейнера -->
        <div class="container header__top-container">
          <div class="header__top">
            <a href="index.html" class="header__logo">
              <img src="img/logo.svg" alt="Логотип компании">
            </a>
            <button class="header__burger" aria-label="Открыть меню"></button>
          </div>
        </div>

        <div class="header__content container">
          <div class="header__content-social">
            <a href="contackt.html" class="btn-stroke">Обратный звонок</a>
            <div class="header__bottom-social">
              <a href="https://vk.com" class="btn-social">
                <svg class="btn-social" viewBox="0 0 50 50">

                </svg>
              </a>

                  <use href="sprites.svg#whatsapp"></use>
                </svg>
              </a>
            </div>
            <div class="header__arrow-wrap">
              <svg class="arrow-down" viewBox="0 0 56 54" width="56" height="54">
                <use href="sprites.svg#arrow-down"></use>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

            <button class="gallery__tab-button btn-stroke" data-target="poems">Стихи</button>
        </div>

        <div class="gallery__tab-content gold-card-style active" id="gallery">

                    <img src="gallery-data/gallery/188.jpg" alt="Изображение 2">

                <div class="gallery-column">

                    <img src="gallery-data/gallery/198.jpg" alt="Изображение 6">

                    <img src="/gallery-data/gallery/181.jpg" alt="Изображение 5">
                    <img src="/gallery-data/gallery/198.jpg" alt="Изображение 6">

                <div class="gallery-column">
                    <img src="/gallery-data/gallery/182.jpg" alt="Изображение 7">

            </div>

</section>
